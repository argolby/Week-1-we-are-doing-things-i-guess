<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: TimesnewRoman, serif;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      background: #00a86b;
      color: #00a86b;
    }
    .card {
      background: #1a2230;
      padding: 60px 20px;
      border-radius: 20px;
      text-align: center;
      max-width: 500 px;
    }
    button {
      background: #00a86b;
      color: #e9d491;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hello, I am Austin</h1>
    <p>I just randomly messe around with this and it did not break this so i just kept going</p>
    <p id="detail">Do you like this green its jade but like i alwasy thought jade was like darker</p>
    <button id="more">Click this for a random fact</button>
  </div>
  <script>
    const button = document.getElementById("more");
    button.addEventListener("click", () => {
      document.getElementById("detail").textContent =
        "I clicked this button in class.";
      button.textContent = "there was higher crime rates in the 90s then right now- DrDebra Jellicoe";
    });
  </script>
</body>
</html>
